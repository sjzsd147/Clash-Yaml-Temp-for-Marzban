# ================= 路由规则 =================
# 优先级: 精确匹配 → 功能分流 → 兜底规则
# 规则间冲突说明:
#   - AdvertisingLite 已排除 Hijacking/Privacy，不重复
#   - Google 已排除 YouTube/YouTubeMusic，不冲突
#   - ChinaMax 已排除 Microsoft/GitHub/OneDrive/Steam/PayPal/YouTube 等，不冲突
#   - Global 已排除 AdvertisingLite/China/ChinaMaxNoIP，不冲突
#   - 精确规则放前面，兜底规则放后面，先匹配到的生效
rules:
  # -------- 1. 基础设施（直连）--------
  - RULE-SET,Lan,DIRECT
  - RULE-SET,NTPService,DIRECT
  - RULE-SET,STUN,DIRECT
  - RULE-SET,Download,DIRECT
  - RULE-SET,PrivateTracker,DIRECT
  - RULE-SET,Speedtest,DIRECT
  - GEOSITE,private,DIRECT
  - GEOIP,lan,DIRECT,no-resolve
  - GEOIP,private,DIRECT,no-resolve

  # -------- 2. 广告/隐私/劫持（拦截）--------
  - RULE-SET,AdvertisingLite,🛑 广告拦截
  - RULE-SET,Privacy,🛑 广告拦截
  - RULE-SET,Hijacking,🛑 广告拦截
  - RULE-SET,BlockHttpDNS,🛑 广告拦截

  # -------- 3. Emby 自建服务（直连）--------
  - RULE-SET,Emby,DIRECT

  # -------- 4. AI 服务（代理）--------
  - RULE-SET,OpenAI,🤖 AI 专属
  - RULE-SET,Claude,🤖 AI 专属
  - RULE-SET,Gemini,🤖 AI 专属
  - RULE-SET,BardAI,🤖 AI 专属
  - RULE-SET,Copilot,🤖 AI 专属
  - RULE-SET,Anthropic,🤖 AI 专属

  # -------- 5. 流媒体 --------
