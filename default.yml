# ====================================================================
#  Clash 全面分流模板 for Marzban
#  规则源: blackmatrix7/ios_rule_script (jsdelivr CDN)
#  更新: 规则集每 12 小时自动拉取
# ====================================================================

# ================= 基础配置 =================
port: 7890
socks-port: 7891
mixed-port: 7897
allow-lan: true
mode: rule
log-level: info
ipv6: true
external-controller: '127.0.0.1:9090'
find-process-mode: strict
unified-delay: true
tcp-concurrent: true
geodata-mode: true

# ================= DNS =================
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: true
  use-hosts: true
  use-system-hosts: true

  # 引导 DNS：纯 IP，用于解析 DoH 域名本身
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    # 本地/局域网
    - '*.lan'
    - '*.local'
    - '*.localhost'
    - '*.home.arpa'
    # 腾讯登录
    - 'localhost.ptlogin2.qq.com'
    - 'localhost.sec.qq.com'
    # 网络连通性检测
    - 'connectivitycheck.gstatic.com'
    - '*.msftconnecttest.com'
    - '*.msftncsi.com'
    # NTP 时间同步
    - 'time.*.com'
    - 'time.*.gov'
    - 'time.*.edu.cn'
    - 'time.*.apple.com'
    - 'time-ios.apple.com'
    - 'time-macos.apple.com'
    - 'ntp.*.com'
    - '*.pool.ntp.org'
    - 'ntp.aliyun.com'
    - 'ntp.tencent.com'
    # Apple 推送/服务
    - '*.push.apple.com'
    - 'push.apple.com'
    # 游戏相关
    - '*.battlenet.com.cn'
    - '*.blzstatic.cn'
    - '*.battle.net'
    - 'stun.l.google.com'

  # 节点域名专用 DNS
  proxy-server-nameserver:
    - system
    - 223.5.5.5
    - 119.29.29.29

  # 主 DNS：优先使用系统默认 DNS（直连域名）
  nameserver:
    - system
    - 223.5.5.5
    - 119.29.29.29

  # 回退 DNS：用于被污染域名的二次解析
  fallback:
    - tls://8.8.4.4
    - tls://1.1.1.1
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4


# ================= 节点列表 =================
# 完美解决 IPv6 括号与 UUID 报错
proxies:
{{ conf.proxies | yaml | replace("'[", "'") | replace("]'", "'") }}

# ================= 策略组 =================
proxy-groups:
  - name: "🚀 节点选择"
    type: select
    proxies:
      - "♻️ 自动测速"
      - "🎯 全局直连"
      {{ proxy_remarks | yaml | indent(6) }}

  - name: "♻️ 自动测速"
    type: url-test
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50
    proxies:
      {{ proxy_remarks | yaml | indent(6) }}

  - name: "🎯 全局直连"
    type: select
    proxies:
      - DIRECT

  - name: "🛑 广告拦截"
    type: select
    proxies:
      - REJECT
      - DIRECT

  - name: "🤖 AI 专属"
    type: select
    proxies:
      - "🚀 节点选择"
      {{ proxy_remarks | yaml | indent(6) }}

  - name: "📹 YouTube"
