# ================= 基础配置 =================
port: 7890
socks-port: 7891
mixed-port: 7897
allow-lan: true
mode: rule
log-level: info
ipv6: true
external-controller: 0.0.0.0:9090
find-process-mode: strict

# ================= DNS =================
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: true
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.lan'
    - 'localhost.ptlogin2.qq.com'
  nameserver-policy:
    "geosite:cn":
      - https://doh.pub/dns-query
      - https://dns.alidns.com/dns-query
    "geosite:microsoft":
      - https://doh.pub/dns-query
      - https://dns.alidns.com/dns-query
    "geosite:apple":
      - https://doh.pub/dns-query
      - https://dns.alidns.com/dns-query
    "rule-set:Microsoft":
      - https://doh.pub/dns-query
      - https://dns.alidns.com/dns-query
    "rule-set:Apple":
      - https://doh.pub/dns-query
      - https://dns.alidns.com/dns-query
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  fallback:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4

# ================= 节点列表 =================
# 完美解决 IPv6 括号与 UUID 报错
proxies:
{{ conf.proxies | yaml | replace("'[", "'") | replace("]'", "'") }}

# ================= 策略组 =================
proxy-groups:
  - name: "🚀 节点选择"
    type: select
    proxies:
      - "♻️ 自动测速"
      - "🎯 全局直连"
      {{ proxy_remarks | yaml | indent(6) }}

  - name: "♻️ 自动测速"
    type: url-test
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50
    proxies:
      {{ proxy_remarks | yaml | indent(6) }}

  - name: "🎯 全局直连"
    type: select
    proxies:
      - DIRECT

  - name: "🛑 广告拦截"
    type: select
    proxies:
      - REJECT
      - DIRECT

  - name: "🤖 AI 专属"
    type: select
    proxies:
      - "🚀 节点选择"
      {{ proxy_remarks | yaml | indent(6) }}

  - name: "✈️ Telegram"
    type: select
    proxies:
      - "🚀 节点选择"
      {{ proxy_remarks | yaml | indent(6) }}

  - name: "🎬 国际媒体"
    type: select
    proxies:
      - "🚀 节点选择"
      {{ proxy_remarks | yaml | indent(6) }}

  - name: "🍎 苹果服务"
    type: select
    proxies:
      - "🎯 全局直连"
      - "🚀 节点选择"
      {{ proxy_remarks | yaml | indent(6) }}

  - name: "Ⓜ️ 微软服务"
    type: select
    proxies:
      - "🎯 全局直连"
      - "🚀 节点选择"
      {{ proxy_remarks | yaml | indent(6) }}

  - name: "🎮 游戏平台"
    type: select
    proxies:
      - "🎯 全局直连"
      - "🚀 节点选择"
      {{ proxy_remarks | yaml | indent(6) }}

  - name: "📺 哔哩哔哩"
    type: select
    proxies:
      - "🎯 全局直连"
      - "🚀 节点选择"
      {{ proxy_remarks | yaml | indent(6) }}

  - name: "🐟 漏网之鱼"
    type: select
    proxies:
      - "🚀 节点选择"
      - "🎯 全局直连"
      {{ proxy_remarks | yaml | indent(6) }}

