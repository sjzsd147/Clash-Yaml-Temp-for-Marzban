# ================= 路由规则 =================
rules:
  # 优先处理局域网与BT下载
  - RULE-SET,Lan,DIRECT
  - RULE-SET,Download,DIRECT
  - GEOSITE,private,DIRECT
  - GEOIP,lan,DIRECT,no-resolve
  - GEOIP,private,DIRECT,no-resolve

  # 去广告
  - RULE-SET,AdvertisingLite,🛑 广告拦截
  - GEOSITE,category-ads-all,🛑 广告拦截

  # AI 专属
  - RULE-SET,OpenAI,🤖 AI 专属
  - RULE-SET,Claude,🤖 AI 专属
  - RULE-SET,Gemini,🤖 AI 专属
  - RULE-SET,Copilot,🤖 AI 专属

  # 特定服务分流
  - RULE-SET,BiliBili,📺 哔哩哔哩
  - RULE-SET,BiliBiliIntl,📺 哔哩哔哩
  - RULE-SET,Telegram,✈️ Telegram
  - RULE-SET,GitHub,🚀 节点选择
  - RULE-SET,GlobalMedia,🎬 国际媒体
  - RULE-SET,Apple,🍎 苹果服务
  - RULE-SET,Microsoft,Ⓜ️ 微软服务
  - RULE-SET,Game,🎮 游戏平台

  # 全球规则兜底 (包含各种国外常规网站)
  - RULE-SET,Global,🚀 节点选择

  # 内置 GEOSITE 作为补充防漏
  - GEOSITE,telegram,✈️ Telegram
  - GEOSITE,apple,🍎 苹果服务
  - GEOSITE,microsoft,Ⓜ️ 微软服务
  - GEOSITE,google,🚀 节点选择
  - GEOSITE,twitter,🚀 节点选择
  - GEOSITE,facebook,🚀 节点选择
  - GEOSITE,instagram,🚀 节点选择

  # 国内服务直连 (云端庞大规则库 + IP库兜底)
  - RULE-SET,ChinaMax,🎯 全局直连
  - GEOSITE,cn,🎯 全局直连
  - GEOIP,CN,🎯 全局直连,no-resolve

  # 最终兜底
  - MATCH,🐟 漏网之鱼
