# ====================================================================
#  Clash 全面分流模板 for Marzban
#  规则源: blackmatrix7/ios_rule_script (jsdelivr CDN)
#  更新: 规则集每 12 小时自动拉取
# ====================================================================

# ================= 基础配置 =================
port: 7890
socks-port: 7891
mixed-port: 7897
allow-lan: true
mode: rule
log-level: info
ipv6: true
external-controller: '0.0.0.0:9090'
find-process-mode: strict
unified-delay: true
tcp-concurrent: true
geodata-mode: true

# ================= DNS =================
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: true
  use-hosts: true
  use-system-hosts: true
  prefer-h3: true

  # 引导 DNS：纯 IP，用于解析 DoH 域名本身
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 1.1.1.1

  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - '*.localhost'
    - '*.home.arpa'
    - 'localhost.ptlogin2.qq.com'
    - 'localhost.sec.qq.com'
    - 'connectivitycheck.gstatic.com'
    - '*.msftconnecttest.com'
    - '*.msftncsi.com'

  # 节点域名专用 DNS（防止循环解析）
  proxy-server-nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query

  # 域名策略：匹配的域名走指定 DNS
  nameserver-policy:
    "geosite:private":
      - https://doh.pub/dns-query
      - https://dns.alidns.com/dns-query
    "geosite:cn":
      - https://doh.pub/dns-query
      - https://dns.alidns.com/dns-query
    "geosite:geolocation-!cn":
      - https://1.1.1.1/dns-query
      - https://dns.google/dns-query
    "geosite:apple":
      - https://doh.pub/dns-query
      - https://dns.alidns.com/dns-query
    "geosite:microsoft":
      - https://doh.pub/dns-query
      - https://dns.alidns.com/dns-query

  # 主 DNS：国内 DoH
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query

  # 备用 DNS：海外 DoH（防污染）
  fallback:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
    - https://dns.google/dns-query

  # fallback 触发条件
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 0.0.0.0/8
      - 10.0.0.0/8
      - 100.64.0.0/10
      - 127.0.0.0/8
      - 169.254.0.0/16
      - 172.16.0.0/12
      - 192.0.0.0/24
      - 192.168.0.0/16
      - 224.0.0.0/4
      - 240.0.0.0/4
    domain:
      - '+.google.com'
      - '+.googleapis.com'
      - '+.googlevideo.com'
      - '+.gstatic.com'
      - '+.youtube.com'
      - '+.facebook.com'
      - '+.twitter.com'
      - '+.x.com'
      - '+.instagram.com'
      - '+.github.com'
      - '+.githubusercontent.com'
      - '+.telegram.org'

# ================= 节点列表 =================
# 完美解决 IPv6 括号与 UUID 报错
proxies:
{{ conf.proxies | yaml | replace("'[", "'") | replace("]'", "'") }}

# ================= 策略组 =================
proxy-groups:
  - name: "🚀 节点选择"
    type: select
    proxies:
      - "♻️ 自动测速"
      - "🎯 全局直连"
      {{ proxy_remarks | yaml | indent(6) }}

  - name: "♻️ 自动测速"
    type: url-test
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50
    proxies:
      {{ proxy_remarks | yaml | indent(6) }}

  - name: "🎯 全局直连"
    type: select
    proxies:
      - DIRECT

  - name: "🛑 广告拦截"
    type: select
    proxies:
      - REJECT
      - DIRECT

  - name: "🤖 AI 专属"
    type: select
    proxies:
      - "🚀 节点选择"
      {{ proxy_remarks | yaml | indent(6) }}

  - name: "📹 YouTube"
